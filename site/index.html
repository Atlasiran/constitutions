<title>Qanun Atlas</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Vazirmatn:wght@300;400;500;600;700&display=swap">
<style>
:root{
  color-scheme:light;
  --ground:#f3f4f7; --surface:#fff; --surface-2:#fafbfc;
  --ink:#12161d; --ink-2:#4d5766; --ink-3:#78818f;
  --line:#dde1e8; --line-2:#eef0f4;
  --accent:#1e4fa3; --accent-soft:#e8eefb;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a;
  --shadow:0 1px 2px rgba(18,22,29,.06),0 8px 24px -12px rgba(18,22,29,.14);
  --f-display:"Newsreader",Georgia,"Times New Roman",serif;
  --f-ui:"Vazirmatn",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --f-mono:ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --ground:#0d1016; --surface:#151922; --surface-2:#1b202a;
  --ink:#e8ebf1; --ink-2:#9aa4b4; --ink-3:#6f7889;
  --line:#242a35; --line-2:#1d222c;
  --accent:#7ea6ff; --accent-soft:#1a2740;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#0d1016; --surface:#151922; --surface-2:#1b202a;
  --ink:#e8ebf1; --ink-2:#9aa4b4; --ink-3:#6f7889;
  --line:#242a35; --line-2:#1d222c;
  --accent:#7ea6ff; --accent-soft:#1a2740;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--f-ui);
  font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;font-weight:600;text-wrap:balance}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- chrome ---------- */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--surface) 88%,transparent);
  backdrop-filter:blur(12px);border-block-end:1px solid var(--line)}
.hdr-in{max-width:1280px;margin-inline:auto;padding-inline:16px;padding-block:10px;
  display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:9px;margin-inline-end:auto}
.brand b{font-family:var(--f-display);font-size:20px;font-weight:600;letter-spacing:-.01em}
.brand span{font-size:11.5px;color:var(--ink-3);letter-spacing:.06em;text-transform:uppercase}
.tabs{display:flex;gap:2px;background:var(--surface-2);padding:3px;border-radius:9px;border:1px solid var(--line)}
.tabs button{border:0;background:transparent;padding:6px 13px;border-radius:6px;cursor:pointer;
  color:var(--ink-2);font-size:13px;font-weight:500;white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.ghost{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 11px;
  cursor:pointer;font-size:12.5px;color:var(--ink-2)}
.ghost:hover{color:var(--ink);border-color:var(--ink-3)}

main{max-width:1280px;margin-inline:auto;padding-inline:16px;padding-block:22px 64px}
.view[hidden]{display:none!important}
.lede{font-family:var(--f-display);font-size:16.5px;line-height:1.6;color:var(--ink-2);
  max-width:64ch;margin-block:0 22px}
.lede em{color:var(--ink);font-style:italic}

/* ---------- panels ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:18px;margin-block-end:18px}
.panel > h2{font-family:var(--f-display);font-size:17px;margin-block-end:3px}
.panel > .sub{color:var(--ink-3);font-size:12.5px;margin-block-end:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* ---------- legend ---------- */
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2);margin-block-end:12px}
.legend i{width:9px;height:9px;border-radius:50%;display:inline-block;margin-inline-end:6px;vertical-align:baseline}

/* ---------- charts ---------- */
.chart{width:100%;overflow-x:auto}
.chart svg{display:block;max-width:100%;height:auto}
.gridline{stroke:var(--line);stroke-width:1}
.axis-t{fill:var(--ink-3);font-size:10.5px;font-family:var(--f-mono)}
.lane-t{fill:var(--ink-2);font-size:11.5px;font-weight:600}
.node{cursor:pointer;stroke:var(--surface);stroke-width:2}
.node:hover{stroke:var(--ink)}
.edge{stroke:var(--line);fill:none}

/* ---------- table ---------- */
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px;min-width:620px}
th{text-align:start;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);
  font-weight:600;padding:8px 10px;border-block-end:1px solid var(--line);position:sticky;top:0;background:var(--surface)}
td{padding:9px 10px;border-block-end:1px solid var(--line-2);vertical-align:top}
tbody tr:hover{background:var(--surface-2)}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;color:var(--ink-2);text-align:end}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-inline-end:7px}
.ttl{font-weight:500}
.ttl small{display:block;font-weight:400;color:var(--ink-3);font-size:12px;margin-block-start:1px}
.flag{display:inline-block;font-size:10.5px;padding:1px 6px;border-radius:4px;background:var(--accent-soft);
  color:var(--accent);margin-inline-start:6px;font-weight:600}

/* ---------- compare ---------- */
select{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:7px 10px;
  max-width:100%;font-size:13px}
.topic-row{display:grid;grid-template-columns:minmax(120px,1.4fr) 1fr;gap:12px;align-items:center;
  padding-block:5px;cursor:pointer;border-radius:6px}
.topic-row:hover{background:var(--surface-2)}
.topic-row.on{background:var(--accent-soft)}
.tname{font-size:12.5px;color:var(--ink-2)}
.tname b{color:var(--ink);font-weight:500}
.bars{display:flex;flex-direction:column;gap:3px}
.bar{height:9px;border-radius:0 4px 4px 0;min-width:2px}
.barlbl{font-family:var(--f-mono);font-size:10.5px;color:var(--ink-3);margin-inline-start:6px}

/* ---------- articles ---------- */
.arts{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-block-start:16px}
.artcol h3{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);
  margin-block-end:8px;font-weight:600}
.art{background:var(--surface-2);border:1px solid var(--line-2);border-radius:9px;padding:11px 13px;margin-block-end:9px}
.art-h{display:flex;gap:8px;align-items:baseline;margin-block-end:5px}
.art-n{font-family:var(--f-mono);font-size:11px;color:var(--accent);font-weight:600}
.art-p{font-family:var(--f-mono);font-size:10.5px;color:var(--ink-3);margin-inline-start:auto}
.fa{direction:rtl;text-align:right;font-family:var(--f-ui);font-size:13.5px;line-height:1.85}
.art .fa{max-height:8.5em;overflow:hidden;position:relative}
.art.open .fa{max-height:none}
.more{border:0;background:none;color:var(--accent);font-size:11.5px;cursor:pointer;padding:3px 0}

/* ---------- search ---------- */
.searchbar{display:flex;gap:9px;flex-wrap:wrap;margin-block-end:14px}
.searchbar input{flex:1;min-width:200px;background:var(--surface-2);border:1px solid var(--line);
  border-radius:9px;padding:9px 13px;font-size:14px}
mark{background:var(--accent-soft);color:var(--ink);border-radius:2px;padding:0 1px}
.hit{border-block-end:1px solid var(--line-2);padding-block:12px}
.hit-src{font-size:11.5px;color:var(--ink-3);margin-block-end:5px}
.hit-src b{color:var(--ink-2);font-weight:500}
.empty{color:var(--ink-3);padding-block:28px;text-align:center;font-size:13.5px}

/* ---------- tooltip ---------- */
#tip{position:fixed;z-index:60;pointer-events:none;background:var(--surface);border:1px solid var(--line);
  border-radius:9px;padding:9px 12px;box-shadow:var(--shadow);font-size:12.5px;max-width:280px;opacity:0;
  transition:opacity .1s}
#tip b{display:block;font-size:13px;margin-block-end:3px}
#tip span{color:var(--ink-3)}

.note{font-size:12px;color:var(--ink-3);border-inline-start:2px solid var(--line);padding-inline-start:11px;
  margin-block-start:14px;line-height:1.6}
@media (max-width:760px){
  .arts{grid-template-columns:1fr}
  .brand span{display:none}
  .tabs{width:100%;overflow-x:auto}
}
</style>

<div class="hdr"><div class="hdr-in">
  <div class="brand"><b>Qanun Atlas</b><span id="brandsub">Iranian constitutional drafts</span></div>
  <div class="tabs" role="tablist" id="tabs"></div>
  <button class="ghost" id="lang">فارسی</button>
  <button class="ghost" id="theme" title="Toggle theme">◐</button>
</div></div>

<main>
  <p class="lede" id="lede"></p>
  <section class="view" id="v-corpus"></section>
  <section class="view" id="v-map" hidden></section>
  <section class="view" id="v-compare" hidden></section>
  <section class="view" id="v-search" hidden></section>
</main>
<div id="tip"></div>

<script>
const T={
 en:{corpus:"Corpus",map:"Similarity",compare:"Compare",search:"Search",
   lede:"Every known draft constitution for Iran, from the 1906 Fundamental Law to the transitional charters of 2020 — <em>extracted, split into articles, and made comparable</em>. Texts appear exactly as their authors wrote them; nothing here is ranked or endorsed.",
   sub:"Iranian constitutional drafts",
   enacted:"Enacted or historical",proposed:"Proposed constitutions",trans:"Transitional & programmatic",
   tl:"The constitutional century",tlsub:"Each mark is one document, placed by year and sized by article count.",
   gr:"How the drafts relate",grsub:"Documents joined where their vocabulary overlaps. Thicker lines mean closer texts.",
   tbl:"All documents",tblsub:"Sorted by year. Article counts are machine-extracted and approximate.",
   cmp:"Side by side",cmpsub:"Pick two documents to see how much each devotes to a given subject. Click a subject to read the articles.",
   srch:"Search every article",srchsub:"Full-text search across the corpus. Type in Persian.",
   year:"Year",doc:"Document",author:"Author",arts:"Articles",pages:"Pages",kind:"Type",
   ph:"e.g. آزادی بیان، حقوق زنان، فدرال",nores:"No articles matched.",
   typein:"Type a word or phrase in Persian to search the corpus.",
   arcount:n=>n+" articles",ocr:"OCR",dup:"duplicate",partial:"partial",
   note:"Article counts come from automated parsing of the source PDFs and may miss or over-split articles in poorly typeset documents. Every article links back to its page in the original. Topic labels are keyword-based and shown for navigation, not as legal classification."},
 fa:{corpus:"پیکره",map:"شباهت",compare:"مقایسه",search:"جست‌وجو",
   lede:"همه‌ی پیش‌نویس‌های شناخته‌شده‌ی قانون اساسی برای ایران، از قانون اساسی مشروطه تا منشورهای دوران گذار — <em>استخراج‌شده، تفکیک‌شده به اصول، و قابل مقایسه</em>. متن‌ها همان‌گونه‌اند که نویسندگانشان نوشته‌اند؛ هیچ‌چیز در اینجا رتبه‌بندی یا تأیید نشده است.",
   sub:"پیش‌نویس‌های قانون اساسی ایران",
   enacted:"مصوب یا تاریخی",proposed:"پیش‌نویس‌های پیشنهادی",trans:"دوران گذار و برنامه‌ها",
   tl:"یک سده قانون‌نویسی",tlsub:"هر نشانه یک سند است؛ جای آن بر پایه‌ی سال و اندازه‌اش بر پایه‌ی شمار اصول.",
   gr:"نسبت پیش‌نویس‌ها با یکدیگر",grsub:"اسناد آن‌جا که واژگانشان هم‌پوشانی دارد به هم پیوسته‌اند. خط ضخیم‌تر یعنی نزدیکی بیشتر.",
   tbl:"همه‌ی اسناد",tblsub:"مرتب بر پایه‌ی سال. شمار اصول به‌صورت ماشینی استخراج شده و تقریبی است.",
   cmp:"رویارو",cmpsub:"دو سند را برگزینید تا ببینید هر یک چقدر به یک موضوع پرداخته است. برای خواندن اصول روی موضوع کلیک کنید.",
   srch:"جست‌وجو در همه‌ی اصول",srchsub:"جست‌وجوی تمام‌متن در سراسر پیکره.",
   year:"سال",doc:"سند",author:"نویسنده",arts:"اصول",pages:"صفحه",kind:"گونه",
   ph:"برای نمونه: آزادی بیان، حقوق زنان، فدرال",nores:"اصلی یافت نشد.",
   typein:"برای جست‌وجو واژه‌ای به فارسی بنویسید.",
   arcount:n=>n+" اصل",ocr:"نویسه‌خوانی",dup:"تکراری",partial:"ناقص",
   note:"شمار اصول از تجزیه‌ی خودکار فایل‌های اصلی به‌دست آمده و ممکن است در اسنادِ بدحروف‌چینی‌شده کم یا زیاد باشد. هر اصل به صفحه‌ی اصلی خود پیوند دارد. برچسب‌های موضوعی بر پایه‌ی کلیدواژه‌اند و برای گشت‌وگذار آمده‌اند، نه طبقه‌بندی حقوقی."}};

const BUCKET={in_force:0,historical:0,draft:1,transitional:2,program:2,treatise:2};
const BCOL=["var(--s1)","var(--s2)","var(--s3)"];
let L="en", CAT=[], AN=null, ARTS=[], view="corpus";
const $=s=>document.querySelector(s), el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const t=k=>T[L][k];

/* ---------- tooltip ---------- */
const tip=$("#tip");
function showTip(e,html){tip.innerHTML=html;tip.style.opacity=1;
  const r=tip.getBoundingClientRect();
  tip.style.left=Math.min(e.clientX+14,innerWidth-r.width-10)+"px";
  tip.style.top=Math.min(e.clientY+14,innerHeight-r.height-10)+"px";}
function hideTip(){tip.style.opacity=0}

/* ---------- boot ---------- */
Promise.all([
  fetch("data/catalog.json").then(r=>r.json()),
  fetch("data/analysis.json").then(r=>r.json()),
  fetch("data/articles.json").then(r=>r.json())
]).then(([c,a,ar])=>{CAT=c;AN=a;ARTS=ar;init()})
 .catch(e=>{$("#v-corpus").innerHTML='<div class="empty">Could not load corpus data.</div>';console.error(e)});

function init(){
  $("#lang").onclick=()=>{L=L==="en"?"fa":"en";
    document.documentElement.lang=L; document.documentElement.dir=L==="fa"?"rtl":"ltr";
    $("#lang").textContent=L==="en"?"فارسی":"English"; render();};
  $("#theme").onclick=()=>{const r=document.documentElement;
    const d=r.getAttribute("data-theme")==="dark"||(!r.getAttribute("data-theme")&&matchMedia("(prefers-color-scheme:dark)").matches);
    r.setAttribute("data-theme",d?"light":"dark"); render();};
  render();
}

function render(){
  $("#brandsub").textContent=t("sub");
  $("#lede").innerHTML=t("lede");
  const tb=$("#tabs");tb.innerHTML="";
  ["corpus","map","compare","search"].forEach(k=>{
    const b=el("button",null,t(k));b.setAttribute("role","tab");
    b.setAttribute("aria-selected",view===k);
    b.onclick=()=>{view=k;render()};tb.append(b);});
  ["corpus","map","compare","search"].forEach(k=>$("#v-"+k).hidden=view!==k);
  ({corpus:corpusView,map:mapView,compare:compareView,search:searchView})[view]();
}

function title(d){return L==="fa"?d.fa:d.en}
function author(d){return L==="fa"?(d.author_fa||""):(d.author_en||"")}

/* ================= CORPUS ================= */
function corpusView(){
  const v=$("#v-corpus");v.innerHTML="";
  const p1=el("div","panel");
  p1.append(el("h2",null,t("tl")),el("div","sub",t("tlsub")),legend());
  p1.append(timeline());
  v.append(p1);

  const p2=el("div","panel");
  p2.append(el("h2",null,t("tbl")),el("div","sub",t("tblsub")));
  const w=el("div","tbl-wrap");w.append(table());p2.append(w);
  p2.append(el("div","note",t("note")));
  v.append(p2);
}
function legend(){
  const g=el("div","legend");
  [t("enacted"),t("proposed"),t("trans")].forEach((n,i)=>
    g.append(el("span",null,`<i style="background:${BCOL[i]}"></i>${esc(n)}`)));
  return g;
}
function timeline(){
  const W=Math.max(620,Math.min(1200,innerWidth-80)),LH=104,H=LH*3+46,PL=L==="fa"?16:132,PR=L==="fa"?132:16;
  const yrs=CAT.map(d=>d.year).filter(Boolean),y0=1900,y1=2025;
  const x=y=>{const f=(Math.max(y0,y)-y0)/(y1-y0);return L==="fa"?W-PR-f*(W-PL-PR):PL+f*(W-PL-PR)};
  const s=[`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(t("tl"))}">`];
  for(let y=1900;y<=2020;y+=20){s.push(`<line class="gridline" x1="${x(y)}" y1="26" x2="${x(y)}" y2="${LH*3+22}"/>`,
    `<text class="axis-t" x="${x(y)}" y="18" text-anchor="middle">${y}</text>`);}
  [t("enacted"),t("proposed"),t("trans")].forEach((n,i)=>{
    const ty=26+i*LH+15;
    s.push(`<text class="lane-t" x="${L==="fa"?W-8:8}" y="${ty}" text-anchor="${L==="fa"?"end":"start"}">${esc(n)}</text>`);});
  const placed=[];
  CAT.forEach((d,i)=>{
    const b=BUCKET[d.type]??2, cx=x(d.year||1900), r=Math.max(4.5,Math.min(17,Math.sqrt(d.n_articles||1)*1.25));
    let cy=26+b*LH+LH/2+8, dir=1, k=0;
    while(placed.some(p=>p.b===b&&Math.hypot(p.cx-cx,p.cy-cy)<p.r+r+3)&&k<28){k++;cy=26+b*LH+LH/2+8+dir*Math.ceil(k/2)*(r+5);dir*=-1;}
    cy=Math.max(26+b*LH+r+6,Math.min(26+(b+1)*LH-r-2,cy));
    placed.push({cx,cy,r,b,d,i});});
  placed.forEach(p=>s.push(`<circle class="node" data-i="${p.i}" cx="${p.cx}" cy="${p.cy}" r="${p.r}" fill="${BCOL[p.b]}" fill-opacity=".82"/>`));
  s.push("</svg>");
  const w=el("div","chart",s.join(""));
  w.querySelectorAll(".node").forEach(n=>{
    const d=CAT[+n.dataset.i];
    n.onmousemove=e=>showTip(e,`<b>${esc(title(d))}</b><span>${esc(author(d))}${d.era?" · "+esc(d.era):""}<br>${esc(t("arcount")(d.n_articles))}</span>`);
    n.onmouseleave=hideTip;});
  return w;
}
function table(){
  const tb=el("table");
  tb.innerHTML=`<thead><tr><th>${t("year")}</th><th>${t("doc")}</th><th>${t("author")}</th>
    <th style="text-align:end">${t("arts")}</th><th style="text-align:end">${t("pages")}</th></tr></thead>`;
  const body=el("tbody");
  CAT.forEach(d=>{
    const b=BUCKET[d.type]??2;
    const tr=el("tr");
    tr.innerHTML=`<td class="num">${d.year||"—"}</td>
      <td class="ttl"><span class="dot" style="background:${BCOL[b]}"></span>${esc(title(d))}
        ${d.ocr?`<span class="flag">${t("ocr")}</span>`:""}${d.duplicate_of?`<span class="flag">${t("dup")}</span>`:""}${(d.confidence<0.8&&["draft","in_force","historical","transitional"].includes(d.type))?`<span class="flag" style="background:transparent;border:1px solid var(--line);color:var(--ink-3)">${t("partial")}</span>`:""}
        <small>${esc(d.source_pdf)}</small></td>
      <td>${esc(author(d))}</td><td class="num">${d.n_articles}</td><td class="num">${d.n_pages}</td>`;
    body.append(tr);});
  tb.append(body);return tb;
}

/* ================= MAP ================= */
function mapView(){
  const v=$("#v-map");v.innerHTML="";
  const p=el("div","panel");
  p.append(el("h2",null,t("gr")),el("div","sub",t("grsub")),legend());
  p.append(graph());
  p.append(el("div","note",t("note")));
  v.append(p);
}
function graph(){
  const W=Math.max(620,Math.min(1100,innerWidth-80)),H=520;
  const ids=CAT.map(c=>c.uid), idx={};ids.forEach((d,i)=>idx[d]=i);
  const nodes=ids.map((id,i)=>{const d=CAT.find(c=>c.uid===id)||{n_articles:1,type:"draft"};
    return{id,d,b:BUCKET[d.type]??2,r:Math.max(5,Math.min(16,Math.sqrt(d.n_articles||1)*1.15)),
      x:W/2+Math.cos(i*2.4)*180,y:H/2+Math.sin(i*2.4)*150,vx:0,vy:0};});
  // edges reference documents by uid; any pointing at a removed document just drop out
  const edges=AN.edges.filter(e=>e.s>0.42&&idx[e.a]!=null&&idx[e.b]!=null)
                      .map(e=>({a:idx[e.a],b:idx[e.b],s:e.s}));
  for(let it=0;it<420;it++){
    for(let i=0;i<nodes.length;i++)for(let j=i+1;j<nodes.length;j++){
      const a=nodes[i],b=nodes[j];let dx=b.x-a.x,dy=b.y-a.y,dd=Math.hypot(dx,dy)||.1;
      const f=1400/(dd*dd);a.vx-=dx/dd*f;a.vy-=dy/dd*f;b.vx+=dx/dd*f;b.vy+=dy/dd*f;
      const mn=a.r+b.r+7; if(dd<mn){const p=(mn-dd)*.5;a.vx-=dx/dd*p;a.vy-=dy/dd*p;b.vx+=dx/dd*p;b.vy+=dy/dd*p;}}
    edges.forEach(e=>{const a=nodes[e.a],b=nodes[e.b];
      let dx=b.x-a.x,dy=b.y-a.y,dd=Math.hypot(dx,dy)||.1;
      const f=(dd-110)*.012*e.s;a.vx+=dx/dd*f;a.vy+=dy/dd*f;b.vx-=dx/dd*f;b.vy-=dy/dd*f;});
    nodes.forEach(n=>{n.vx+=(W/2-n.x)*.0016;n.vy+=(H/2-n.y)*.0016;
      n.x+=n.vx*.62;n.y+=n.vy*.62;n.vx*=.82;n.vy*=.82;
      n.x=Math.max(n.r+4,Math.min(W-n.r-4,n.x));n.y=Math.max(n.r+4,Math.min(H-n.r-4,n.y));});}
  const s=[`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(t("gr"))}">`];
  edges.forEach(e=>s.push(`<line class="edge" x1="${nodes[e.a].x.toFixed(1)}" y1="${nodes[e.a].y.toFixed(1)}" x2="${nodes[e.b].x.toFixed(1)}" y2="${nodes[e.b].y.toFixed(1)}" stroke-width="${(e.s*3.4).toFixed(2)}" stroke-opacity="${(e.s*.9).toFixed(2)}"/>`));
  nodes.forEach((n,i)=>s.push(`<circle class="node" data-i="${i}" cx="${n.x.toFixed(1)}" cy="${n.y.toFixed(1)}" r="${n.r}" fill="${BCOL[n.b]}" fill-opacity=".85"/>`));
  s.push("</svg>");
  const w=el("div","chart",s.join(""));
  w.querySelectorAll(".node").forEach(c=>{const n=nodes[+c.dataset.i];
    c.onmousemove=e=>{const near=edges.filter(x=>x.a===+c.dataset.i||x.b===+c.dataset.i)
      .sort((p,q)=>q.s-p.s).slice(0,2)
      .map(x=>{const o=nodes[x.a===+c.dataset.i?x.b:x.a];return esc(title(o.d))+" ("+x.s.toFixed(2)+")"}).join("<br>");
      showTip(e,`<b>${esc(title(n.d))}</b><span>${esc(t("arcount")(n.d.n_articles))}${near?"<br><br>"+near:""}</span>`)};
    c.onmouseleave=hideTip;});
  return w;
}

/* ================= COMPARE ================= */
let cmpA=null,cmpB=null,cmpT=null;
function compareView(){
  const v=$("#v-compare");v.innerHTML="";
  const withArts=CAT.filter(d=>d.n_articles>5);
  if(!cmpA)cmpA=(withArts.find(d=>d.type==="draft")||withArts[0]).uid;
  if(!cmpB)cmpB=(withArts.find(d=>d.uid!==cmpA&&d.type==="draft")||withArts[1]).uid;
  const p=el("div","panel");
  p.append(el("h2",null,t("cmp")),el("div","sub",t("cmpsub")));
  const row=el("div","row");
  [["A",cmpA,i=>cmpA=i],["B",cmpB,i=>cmpB=i]].forEach(([k,cur,set],n)=>{
    const s=el("select");
    withArts.forEach(d=>{const o=el("option",null,esc(title(d))+" ("+d.n_articles+")");o.value=d.uid;
      if(d.uid===cur)o.selected=true;s.append(o)});
    s.onchange=()=>{set(s.value);cmpT=null;compareView()};
    const wrap=el("div");wrap.style.flex="1";wrap.style.minWidth="220px";
    wrap.append(el("div",null,`<span class="dot" style="background:${n?"var(--s2)":"var(--s1)"}"></span><small style="color:var(--ink-3)">${k}</small>`),s);
    row.append(wrap);});
  p.append(row);

  const A=ARTS.filter(a=>a.doc===cmpA),B=ARTS.filter(a=>a.doc===cmpB);
  const cnt=o=>{const m={};o.forEach(a=>a.topics.forEach(x=>m[x]=(m[x]||0)+1));return m};
  const ca=cnt(A),cb=cnt(B),max=Math.max(1,...Object.values(ca),...Object.values(cb));
  const list=el("div");list.style.marginBlockStart="16px";
  Object.keys(AN.topics).forEach(k=>{
    const a=ca[k]||0,b=cb[k]||0; if(!a&&!b)return;
    const r=el("div","topic-row"+(cmpT===k?" on":""));
    r.innerHTML=`<div class="tname"><b>${esc(AN.topics[k][L])}</b></div>
      <div class="bars">
        <div style="display:flex;align-items:center"><div class="bar" style="width:${a/max*100}%;background:var(--s1)"></div><span class="barlbl">${a}</span></div>
        <div style="display:flex;align-items:center"><div class="bar" style="width:${b/max*100}%;background:var(--s2)"></div><span class="barlbl">${b}</span></div>
      </div>`;
    r.onclick=()=>{cmpT=cmpT===k?null:k;compareView()};
    list.append(r);});
  p.append(list);
  if(cmpT){
    const g=el("div","arts");
    [[cmpA,A,"var(--s1)"],[cmpB,B,"var(--s2)"]].forEach(([id,arr,col])=>{
      const c=el("div","artcol"),d=CAT.find(x=>x.uid===id);
      c.append(el("h3",null,`<span class="dot" style="background:${col}"></span>`+esc(title(d))));
      const hits=arr.filter(a=>a.topics.includes(cmpT));
      if(!hits.length)c.append(el("div","empty",t("nores")));
      hits.slice(0,14).forEach(a=>c.append(artCard(a,d)));
      g.append(c);});
    p.append(g);}
  p.append(el("div","note",t("note")));
  v.append(p);
}
function artCard(a,d){
  const c=el("div","art");
  c.innerHTML=`<div class="art-h"><span class="art-n">${esc(a.unit)} ${a.n}</span>
    <span class="art-p">p.${a.page}</span></div><div class="fa" dir="rtl" lang="fa">${esc(a.text)}</div>`;
  if(a.text.length>320){const b=el("button","more","…");
    b.textContent=L==="fa"?"بیشتر":"Show more";
    b.onclick=()=>{c.classList.toggle("open");
      b.textContent=c.classList.contains("open")?(L==="fa"?"کمتر":"Show less"):(L==="fa"?"بیشتر":"Show more")};
    c.append(b);}
  return c;
}

/* ================= SEARCH ================= */
let q="";
function searchView(){
  const v=$("#v-search");v.innerHTML="";
  const p=el("div","panel");
  p.append(el("h2",null,t("srch")),el("div","sub",t("srchsub")));
  const bar=el("div","searchbar");
  const inp=el("input");inp.id="q";inp.placeholder=t("ph");inp.value=q;
  inp.dir="rtl";inp.setAttribute("lang","fa");
  bar.append(inp);p.append(bar);
  const res=el("div");p.append(res);
  const run=()=>{q=inp.value.trim();res.innerHTML="";
    if(q.length<2){res.append(el("div","empty",t("typein")));return}
    const hits=ARTS.filter(a=>a.text.includes(q)).slice(0,60);
    if(!hits.length){res.append(el("div","empty",t("nores")));return}
    res.append(el("div","sub",hits.length+(L==="fa"?" نتیجه":" results")));
    hits.forEach(a=>{const d=CAT.find(c=>c.uid===a.doc)||{};
      const i=a.text.indexOf(q),s=Math.max(0,i-110);
      const snip=(s?"…":"")+esc(a.text.slice(s,i))+"<mark>"+esc(q)+"</mark>"+esc(a.text.slice(i+q.length,i+q.length+180))+"…";
      const h=el("div","hit");
      h.innerHTML=`<div class="hit-src"><b>${esc(title(d))}</b> · ${esc(a.unit)} ${a.n} · p.${a.page}</div>
        <div class="fa" dir="rtl" lang="fa">${snip}</div>`;
      res.append(h);});};
  inp.oninput=run;run();
  setTimeout(()=>inp.focus(),0);
  p.append(el("div","note",t("note")));
  v.append(p);
}
</script>
